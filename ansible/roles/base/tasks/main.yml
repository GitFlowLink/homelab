- name: update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
    
- name: Download base utility
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - htop
    - curl
    - git
    - vim
    - net-tools
    - ufw

- name: set timezone to Asia/Yekaterinburg
  community.general.timezone:
    name: Asia/Yekaterinburg
